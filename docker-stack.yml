version: "3.8"
name: chatbotx-stack

# ─────────────────────────────────────────────────────────────────────────────
# ChatbotX — Production Docker Stack (Pronto para Portainer / Swarm / Compose)
# Consome as imagens geradas automaticamente pelo GitHub Actions (GHCR)
# ─────────────────────────────────────────────────────────────────────────────

x-service-common: &service-common
  restart: always
  env_file:
    - .env
  networks:
    - chatbotx-network

services:
  # ─────────────────────────────────────────────
  # Banco de Dados Relacional & Vetorial (Postgres 18 + pgvector + TimescaleDB)
  # ─────────────────────────────────────────────
  postgres:
    <<: *service-common
    image: timescale/timescaledb-ha:pg18-all
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/home/postgres/pgdata
    command: ["postgres", "-c", "log_statement=${POSTGRES_LOG_STATEMENT:-none}", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbotx}
      POSTGRES_USER: ${POSTGRES_USER:-chatbotx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretkey}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Filas BullMQ, Cache e Streams (Redis 8 com AOF)
  # ─────────────────────────────────────────────
  redis:
    <<: *service-common
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Armazenamento de Arquivos e Mídias (S3 / RustFS)
  # ─────────────────────────────────────────────
  filesystem:
    <<: *service-common
    image: rustfs/rustfs:latest
    command: server /data
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-chatbotx}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-secretkey}
      RUSTFS_API_CORS_ALLOW_ORIGIN: ${RUSTFS_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - filesystem-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  filesystem-init:
    <<: *service-common
    image: rustfs/rc:latest
    depends_on:
      filesystem:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-chatbotx}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-secretkey}
    entrypoint: >
      /bin/sh -c "rc alias set local http://filesystem:9000
      $${RUSTFS_ACCESS_KEY} $${RUSTFS_SECRET_KEY}; rc mb local/chatbotx
      --ignore-existing; touch /tmp/empty && rc cp /tmp/empty
      local/chatbotx/public/; rc anonymous set public local/chatbotx/public;"

  # ─────────────────────────────────────────────
  # Sandbox de Execução JS de Fluxos (Rede Interna Segura)
  # ─────────────────────────────────────────────
  javascript-executor:
    restart: always
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAMESPACE:-paulo}/chatbotx-javascript-executor:${IMAGE_TAG:-main}
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
    networks:
      - internal-executor-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # Aplicação Principal (Next.js 16 UI / API oRPC / Webhooks)
  # ─────────────────────────────────────────────
  builder:
    <<: *service-common
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAMESPACE:-paulo}/chatbotx-builder:${IMAGE_TAG:-main}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      NODE_ENV: production
      RUN_DB_MIGRATE: "false"
      RUN_DB_SEED: "false"

  # ─────────────────────────────────────────────
  # Motor de Background (BullMQ Workers em Modo Standalone)
  # ─────────────────────────────────────────────
  worker:
    <<: *service-common
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAMESPACE:-paulo}/chatbotx-worker:${IMAGE_TAG:-main}
    networks:
      - chatbotx-network
      - internal-executor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
      javascript-executor:
        condition: service_healthy
    environment:
      NODE_ENV: production
      JAVASCRIPT_EXECUTOR_URL: http://javascript-executor:3210
      DATABASE_POOL_MAX: 80
    command: ["worker", "standalone"]

  # ─────────────────────────────────────────────
  # Gateway WebSocket em Tempo Real (uWebSockets.js)
  # ─────────────────────────────────────────────
  realtime:
    <<: *service-common
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAMESPACE:-paulo}/chatbotx-realtime:${IMAGE_TAG:-main}
    ports:
      - "127.0.0.1:1999:1999"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      REALTIME_BUILDER_URL: http://builder:3000

  # ─────────────────────────────────────────────
  # Microserviço WhatsApp QR Code (Whatsmeow Go Bridge)
  # ─────────────────────────────────────────────
  whatsmeow-bridge:
    <<: *service-common
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE_NAMESPACE:-paulo}/chatbotx-whatsmeow:${IMAGE_TAG:-main}
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      PORT: 8089
      WEBHOOK_URL: http://builder:3000/api/whatsmeow/webhook
      WHATSMEOW_SECRET: ${WHATSMEOW_SECRET}
      DATA_PATH: /app/data
    volumes:
      - whatsmeow-data:/app/data

networks:
  chatbotx-network:
    driver: bridge
  internal-executor-network:
    driver: bridge
    internal: true

volumes:
  db-data:
  cache-data:
  filesystem-data:
  whatsmeow-data:
